[package]
name = "voxtral-speech-to-text"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
opus = "0.3"
ogg = "0.9"
flume = "0.11"
ctrlc = "3"
rodio = { version = "0.21.1" }
voice_activity_detector = "0.2.1"
winit = "0.30.13"
wgpu = "28.0.0"
pollster = "0.4"
raqote = "0.8.5"
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
enigo = "0.6"
tray-icon = { version = "0.24.0", default-features = false }
rdev = { git = "https://github.com/Narsil/rdev", rev = "c14f2dc5c8100a96c5d7e3013de59d6aa0b9eae2" }
core-graphics = "0.24.0"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "remote_desktop", "screencast"] }
futures = "0.3.32"
xkeysym = "0.2.1"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

