[package]
name = "voxtral-speech-to-text"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
opus = "0.3"
ogg = "0.9"
flume = "0.11"
enigo = { git = "https://github.com/enigo-rs/enigo", branch = "main", default-features = false, features = ["xdg_desktop", "smol"] }
ctrlc = "3"
rodio = { version = "0.21.1" }
voice_activity_detector = "0.2.1"
winit = "0.30.13"
wgpu = "28.0.0"
pollster = "0.4"
raqote = "0.8.5"
bytemuck = { version = "1", features = ["derive"] }
tray-icon = { version = "0.22.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
rdev = { git = "https://github.com/Narsil/rdev", rev = "c14f2dc5c8100a96c5d7e3013de59d6aa0b9eae2" }
core-graphics = "0.24.0"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
futures-util = "0.3"
libloading = "0.8"

